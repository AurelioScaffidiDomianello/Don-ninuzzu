<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Don Ninuzzu 'u Barchittu</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  :root{
    --bordeaux:#5c1a24;
    --bordeaux-dark:#3d0f16;
    --gold:#c9a24b;
    --gold-light:#e6cd8a;
    --parchment:#f4ecd8;

  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{

    font-family:'EB Garamond', serif;
    overscroll-behavior:none;
  }
  #app{
    position:fixed; inset:0;
    height:100dvh; height:100vh;

  }
  #book{
    position:relative;
    width:100%; max-width:520px;
    height:100dvh; height:100vh;
    background:var(--parchment);
    overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,0.6);
  }
  .page{
    position:absolute; inset:0;
    display:flex; flex-direction:column;

    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--parchment);
    color:var(--ink);
  }

  /* header strip on content pages */
  .page-header{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Cinzel', serif;
    font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color:var(--bordeaux);
    opacity:0.65;
    border-bottom:1px solid var(--gold);
    padding-bottom:8px; margin-bottom:20px;
    flex-shrink:0;
  }

  .body-text{ flex:1; font-size:18px; line-height:1.65; }
  .body-text p{ margin:0 0 16px 0; }
  .dropcap{
    float:left; font-family:'Cinzel', serif; font-weight:700;
    font-size:52px; line-height:0.8; color:var(--bordeaux);
    padding:6px 8px 0 0;
  }

  .page-footer{
    text-align:center; font-family:'Cinzel', serif; font-size:12px;
    color:var(--bordeaux); opacity:0.7; letter-spacing:1px;
    padding-top:10px; flex-shrink:0;
  }

  /* COVER */
  .cover{
    background:linear-gradient(180deg, var(--bordeaux) 0%, var(--bordeaux-dark) 100%);

    justify-content:center; align-items:center; text-align:center;
    padding:40px 28px;
  }
  .cover .kicker{
    font-family:'Cinzel',serif; font-size:12px; letter-spacing:3px;
    color:var(--gold-light); text-transform:uppercase; margin-bottom:18px;
  }
  .cover h1{
    font-family:'Cinzel', serif; font-weight:900; font-size:38px;
    letter-spacing:2px; margin:0; color:var(--gold-light);
    text-shadow:0 2px 10px rgba(0,0,0,0.4);
  }
  .cover h2{
    font-family:'Cinzel', serif; font-weight:600; font-size:19px;
    letter-spacing:6px; margin:6px 0 14px; color:var(--parchment);
  }
  .cover .subtitle{
    font-family:'EB Garamond', serif; font-style:italic; font-size:14px;
    color:var(--gold-light); margin-bottom:10px; letter-spacing:0.5px;
  }
  .cover .frame{
    border:1px solid var(--gold); padding:8px; margin:6px 0 14px;
    font-size:11px; line-height:1.4; color:var(--parchment); opacity:0.9;
  }
  .cover .frame img{
    width:100%; display:block; border-radius:2px; margin-bottom:8px;
  }
  .cover .frame .caption{
    opacity:0.8;
  }
  .cover .cover-photo-wrap{
    width:230px; height:230px; border-radius:50%;
    overflow:hidden; margin:14px 0 20px;
    border:4px solid var(--gold);
    box-shadow:0 6px 24px rgba(0,0,0,0.55);
    flex-shrink:0;
  }
  .cover .cover-photo-wrap img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .cover .photo-caption{
    font-size:11px; color:var(--gold-light); opacity:0.75; letter-spacing:0.5px;
    margin-top:-12px; margin-bottom:18px; font-style:italic;
  }
  .cover .author{
    font-family:'Cinzel', serif; font-size:13px; letter-spacing:1.5px;
    margin-top:auto; color:var(--gold-light);
  }
  .cover .ornament{ color:var(--gold); font-size:22px; margin:14px 0; letter-spacing:8px; }

  /* DEDICA / QUOTE style pages */
  .dedica{
    justify-content:center; text-align:center;
    background:linear-gradient(180deg, var(--parchment) 0%, var(--parchment-dark) 100%);
  }
  .dedica h3{
    font-family:'Cinzel', serif; color:var(--bordeaux); letter-spacing:2px;
    font-size:16px; margin-bottom:20px;
  }
  .dedica p{
    font-size:19px; line-height:1.7; font-style:italic; color:var(--ink);
    margin:0 0 14px;
  }
  .dedica .signoff{ margin-top:24px; font-family:'Cinzel',serif; font-size:13px; letter-spacing:1px; color:var(--bordeaux); font-style:normal;}
  .dedica .sep{ color:var(--gold); font-size:18px; letter-spacing:10px; margin:16px 0; }

  /* INDICE */
  .indice h3{
    font-family:'Cinzel', serif; color:var(--bordeaux); letter-spacing:3px;
    font-size:20px; text-align:center; margin-bottom:22px; flex-shrink:0;
  }
  .indice-list{ flex:1; overflow-y:auto; }
  .indice-row{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:17px; padding:9px 0; border-bottom:1px dotted var(--gold);
  }
  .indice-row .t{ color:var(--ink); }
  .indice-row .n{ font-family:'Cinzel',serif; color:var(--bordeaux); font-size:14px; }

  /* SECTION TITLE inside content pages */
  .section-title{
    font-family:'Cinzel', serif; color:var(--bordeaux); font-weight:600;
    font-size:20px; letter-spacing:1px; margin-bottom:16px; flex-shrink:0;
  }

  /* toolbar */
  .toolbar{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top));
    background:linear-gradient(180deg, rgba(61,15,22,0.92), rgba(61,15,22,0));
    pointer-events:none;
  }
  .toolbar button{
    pointer-events:auto;
    background:rgba(244,236,216,0.12);
    border:1px solid var(--gold);
    color:var(--gold-light);
    font-family:'Cinzel',serif; font-size:10px; letter-spacing:1px;
    padding:7px 10px; border-radius:6px; cursor:pointer;
  }
  .toolbar button:active{ background:rgba(244,236,216,0.25); }

  /* nav arrows */
  .nav-btn{
    position:absolute; top:50%; transform:translateY(-50%);
    width:40px; height:40px; border-radius:50%;
    background:rgba(61,15,22,0.35); color:var(--gold-light);
    border:1px solid rgba(201,162,75,0.5);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; z-index:15; cursor:pointer; user-select:none;
  }
  .nav-prev{ left:8px; }
  .nav-next{ right:8px; }
  .nav-btn.hidden{ opacity:0; pointer-events:none; }

  /* bottom progress */
  .progress-wrap{
    position:absolute; bottom:0; left:0; right:0; z-index:20;
    padding:8px 20px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, rgba(61,15,22,0.85), rgba(61,15,22,0));
    display:flex; align-items:center; gap:10px;
  }
  .progress-track{
    flex:1; height:3px; background:rgba(244,236,216,0.25); border-radius:2px; overflow:hidden;
  }
  .progress-fill{ height:100%; background:var(--gold); width:0%; transition:width .2s; }
  .progress-label{
    font-family:'Cinzel',serif; font-size:10px; color:var(--gold-light); letter-spacing:1px; white-space:nowrap;
  }
</style>
</head>
<body>
<div id="app">
  <div id="book">
    <div class="toolbar">
      <button id="btnSave">⬇ SALVA</button>
      <button id="btnShare">📤 CONDIVIDI</button>
    </div>
    <div id="pageContainer"></div>
    <div class="nav-btn nav-prev" id="prevBtn">‹</div>

      <div class="progress-label" id="pageLabel">1 / 89</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </div>
</div>

<script>
/* ============ DATA ============ */
const HEADER = "Don Ninuzzu";

// Each entry: {type: 'cover'|'dedica'|'indice'|'content', ...}
const pages = [];

// PAGE 1 — COVER
pages.push({type:'cover'});

// PAGE 2 — APERTURA
pages.push({type:'content', num:2, title:null, dropcap:'A',
  paras:[
    "come Aurelio, come Appartenenza, come Anima, come Affetto, come Amore.",
    "Sono Aurelio Scaffidi Domianello, funzionario direttivo contabile al Comune di Piraino, il luogo dove sono nato, sono cresciuto e dove vivo tuttora.",
    "In questo momento della mia vita, sospeso tra ospedali e casa, tra carte che sanno ancora di salsedine e ricordi che non hanno mai smesso di respirare, ho sentito il bisogno di tornare alle radici."
  ]});

// PAGE 3 — DEDICA 1/3
pages.push({type:'dedica', num:3, kicker:'Dedica a Don Ninuzzo',
  paras:[
    "Don Ninuzzu 'u Barchittu — l'uomo mite e umile che amò il mare e la sua famiglia.",
    "Ci sono uomini che attraversano il mondo lasciando rumore.",
    "E poi ci sono uomini che lasciano il bene.",
    "Don Ninuzzu apparteneva a questi ultimi.",
    "Il mare gli ha dato il lavoro, la forza e il rispetto; la famiglia gli ha dato il senso di ogni ritorno."
  ]});

// PAGE 4 — DEDICA 2/3
pages.push({type:'dedica', num:4, kicker:null,
  paras:[
    "Non cercò ricchezze né onori. Gli bastavano una barca, il profumo della salsedine, il sorriso dei suoi cari e la serenità di una coscienza pulita.",
    "La sua vita fu fatta di sacrifici silenziosi, di mani segnate dal lavoro e di un cuore capace di amare senza chiedere nulla in cambio."
  ]});

// PAGE 5 — DEDICA 3/3
pages.push({type:'dedica', num:5, kicker:null,
  paras:[
    "Questo libro nasce per custodire la memoria di un uomo semplice, che nella sua umiltà è stato grande.",
    "Perché il tempo porta via molte cose, ma non cancella l'esempio di chi ha vissuto con dignità, ha amato profondamente e ha fatto della famiglia il suo porto più sicuro.",
    "Finché ci sarà qualcuno a raccontare la sua storia, Don Ninuzzu continuerà a navigare, sospinto dal vento della memoria e dall'affetto di chi gli ha voluto bene."
  ],
  signoff:"Con affetto, riconoscenza e stima — Aurelio Scaffidi Domianello, Agosto 2026"});

// INDICE — 4 pages
pages.push({type:'indice', num:'i1', title:'Indice', rows:[
  ["Dedica","3"],["Apertura","2"],["A mè terra chi nun si scorda mai","7"],
  ["La Torre delle Ciavole","11"],["Piraino e Gliaca","13"],
  ["Don Ninuzzu, chi era","14"],["Una giornata sul mare","17"],
  ["La prima seppia","19"],["Ridevamo come due bambini","23"]
]});
pages.push({type:'indice', num:'i2', title:'Indice', rows:[
  ["La fiducia e il modello 740","26"],["Le reti e il nodo che non scivola","29"],
  ["La barca Maria Pia","32"],["Il mercato del pesce","34"],
  ["La staffetta delle seppie","36"],["Maria Pia","42"],
  ["Un uomo d'altri tempi","44"],["Gli anni che passano","48"]
]});
pages.push({type:'indice', num:'i3', title:'Indice', rows:[
  ["L'ultima seppia","50"],["Come conobbe l'amata moglie Giannina","51"],
  ["Giannina","53"],["27 giorni prima","55"],["Il commiato","59"],
  ["Un pensiero mio","61"],["Finale","62"]
]});
pages.push({type:'indice', num:'i4', title:'Indice', rows:[
  ["I tre figli","65"],["Vincenzo","66"],["Maria Pia","69"],
  ["Tony","71"],["Nota dell'autore","82"]
]});

// PAGE 6
pages.push({type:'content', num:6, title:null, dropcap:'H',
  paras:[
    "o conosciuto Don Ninuzzu negli anni Ottanta, quando ero poco più che un ragazzo e lui era già, per tutti a Gliaca, Don Ninuzzu.",
    "Non ricordo il primo giorno con precisione, ma ricordo bene la sensazione: quella di trovarmi davanti a un uomo fatto della stessa materia del mare che lo circondava.",
    "Da allora sono passati tanti anni, eppure ogni volta che chiudo gli occhi lo rivedo lì, seduto fuori casa, con il cappello in mano e lo sguardo rivolto alle Eolie."
  ]});

// PAGE 7 — A mè terra chi nun si scorda mai
pages.push({type:'content', num:7, title:"A mè terra chi nun si scorda mai", dropcap:'D',
  paras:[
    "on Ninuzzu diceva sempre: a mè terra chi nun si scorda mai è Gliaca di Piraino.",
    "Con le Eolie disegnate all'orizzonte e la Torre delle Ciavole che dal Cinquecento veglia sul mare, costruita per avvistare i saraceni e rimasta, da allora, come sentinella di pietra.",
    "Ogni volta che pronunciava quel nome, Gliaca, lo faceva con un tono diverso da come si nomina un semplice paese: lo diceva come si nomina una persona amata."
  ]});

// PAGE 8
pages.push({type:'content', num:8, title:null, dropcap:'N',
  paras:[
    "egli anni Ottanta, quando ci conoscemmo, Gliaca non era quella di oggi.",
    "Poche case, una sola strada, il bar di sempre, le barche tirate a secco sulla spiaggia, l'odore delle reti stese al sole ad asciugare: noi dicevamo semplicemente Gliaca, e bastava.",
    "Il tempo lì sembrava scandito non dagli orologi ma dalle maree, dalle stagioni della pesca, dal vento che cambiava direzione."
  ]});

// PAGE 9
pages.push({type:'content', num:9, title:null, dropcap:'O',
  paras:[
    "ggi Gliaca di Piraino è una splendida cittadina che si affaccia sul mare, con esercizi commerciali, strutture ricettive, alberghi e villaggi turistici.",
    "La spiaggia di ciottoli chiari, con le sue docce e il parcheggio gratuito per chi arriva presto al mattino, accoglie ogni estate migliaia di persone che non sanno nulla della Gliaca di una volta.",
    "Ma il cuore antico del paese resta lì, sotto la superficie, nelle barche tirate a secco che ancora oggi qualcuno tiene, nella curva del Castello, nella Torre delle Ciavole che tutto guarda e tutto ricorda."
  ]});

// PAGE 10
pages.push({type:'content', num:10, title:null, dropcap:'U',
  paras:[
    "mari va rispittatu, diceva Don Ninuzzu, e lo diceva piano, con la stessa cadenza con cui si recita una preghiera laica.",
    "Il mare non perdona gli sbadati, ripeteva: devi guardarlo, devi rispettarlo, se lo sfidi perdi, se lo ascolti ti riporta sempre a casa.",
    "Era una frase che sembrava semplice, quasi banale, ma dietro c'era tutta la sapienza di una vita passata a leggere l'acqua come altri leggono un libro."
  ]});

// PAGE 11 — La Torre delle Ciavole
pages.push({type:'content', num:11, title:"La Torre delle Ciavole", dropcap:'L',
  paras:[
    "a Torre delle Ciavole prende il nome dalle ciaule, le taccole che un tempo nidificavano tra le sue pietre antiche, cercando riparo nelle crepe scavate dal tempo e dal vento.",
    "Fu costruita, si dice, tra il Cinquecento e il Seicento, quando le coste siciliane vivevano nel timore costante delle incursioni saracene, e ogni torre come questa era un occhio vigile puntato sul mare.",
    "Don Ninuzzu ne parlava come si parla di un parente anziano: con rispetto, con un pizzico di orgoglio, come se quella torre di pietra facesse in qualche modo parte della sua stessa famiglia."
  ]});

// PAGE 12
pages.push({type:'content', num:12, title:null, dropcap:'D',
  paras:[
    "a bambino, raccontava, si arrampicava fin lassù con gli amici, sfidando i genitori che li richiamavano a gran voce dalla marina.",
    "Da adulto, la torre era diventata il suo punto fermo, la misura di ogni distanza: la curva del Castello era a quattrocento metri dalla torre, la sua casa poco più in là, il mare sempre davanti.",
    "Mi piace pensare che, da lassù, la torre abbia visto passare tutta la sua vita: un ragazzino che si arrampicava, un pescatore che tirava le reti, un vecchio che ogni sera controllava che la barca fosse ben ormeggiata prima di andare a dormire."
  ]});

// PAGE 13 — Piraino e Gliaca
pages.push({type:'content', num:13, title:"Piraino e Gliaca", dropcap:'P',
  paras:[
    "iraino, il paese che mi ha dato i natali e dove lavoro ancora oggi, guarda Gliaca dall'alto, come una madre che osserva il figlio giocare vicino al mare.",
    "Le due realtà, il borgo collinare e la frazione marinara, sono da sempre legate da un filo invisibile fatto di famiglie che si dividono tra le due case, tra l'ulivo e la barca.",
    "Don Ninuzzu, pur essendo nato a Piraino, aveva scelto Gliaca senza mai rinnegare le sue radici: portava il paese alto dentro di sé, mentre viveva rivolto verso il mare."
  ]});

// PAGE 14 — Don Ninuzzu, chi era
pages.push({type:'content', num:14, title:"Don Ninuzzu, chi era", dropcap:'A',
  paras:[
    "ll'anagrafe si chiamava Domenico Ricciardi Barchitto, ma per tutto il paese era Antonino Ricciardi Barchitto, detto Don Ninuzzu u Barchittu.",
    "Due nomi per una sola persona: quello scritto sui documenti e quello che il paese gli aveva cucito addosso, come si cuce un vestito su misura, negli anni.",
    "Era nato a Piraino, ma aveva scelto Gliaca come casa del mare, perché a Gliaca il mare non è una cartolina: è lavoro quotidiano, mani spaccate dal sale, schiena curva a tirare le reti."
  ]});

// PAGE 15
pages.push({type:'content', num:15, title:null, dropcap:'E',
  paras:[
    "ra un uomo con la misura delle parole: poche, ma sempre giuste, e sempre dette guardando negli occhi.",
    "Aveva presenza, come si dice di certi uomini che entrano in una stanza e la stanza cambia leggermente, si fa più ordinata: solido come una barca ben ormeggiata, che non teme il maltempo.",
    "Quando incontrava qualcuno si toglieva il cappello con un rispetto antico, una volta sola, lentamente, e chi riceveva quel saluto capiva di essere stato riconosciuto, non solo salutato."
  ]});

// PAGE 16
pages.push({type:'content', num:16, title:null, dropcap:'V',
  paras:[
    "iveva a due passi dalla marina, in una casa semplice: due stanze, un tavolo di legno consumato dall'uso, sedie di paglia intrecciata, foto di famiglia appese alle pareti.",
    "Dalla finestra, se ti affacciavi, vedevi sempre lei: la barca, ormeggiata, che ondeggiava piano al ritmo del mare, come un animale addomesticato che aspetta il padrone.",
    "La Torre delle Ciavole era il suo punto di riferimento, la sua bussola di terra: da lì si vedeva la curva del Castello, a circa quattrocento metri, e poi la discesa dolce verso la marina di Gliaca."
  ]});

// PAGE 17 — Una giornata sul mare
pages.push({type:'content', num:17, title:"Una giornata sul mare", dropcap:'N',
  paras:[
    "on l'ho mai visto partire all'alba, ma tante volte, arrivando presto a Gliaca, ho trovato le sue tracce ancora fresche: la sabbia smossa dove aveva trascinato la barca, l'odore di sale e di motore appena spento.",
    "Immagino quelle albe, perché lui me le raccontava a pezzi, senza mai indulgere troppo nei dettagli: il cielo che si schiariva piano sopra le Eolie, il primo caffè bevuto in piedi, il motore che si accendeva al terzo tentativo, mai al primo.",
    "Poi il silenzio del mare aperto, rotto solo dal rumore dell'acqua contro lo scafo, e lui lì, solo, a leggere le correnti come si legge il volto di un vecchio amico."
  ]});

// PAGE 18
pages.push({type:'content', num:18, title:null, dropcap:'T',
  paras:[
    "ornava sempre a metà mattina, con il sole ormai alto, e il pescato disposto ordinatamente sul fondo della barca.",
    "Chi lo vedeva arrivare sapeva già, dal modo in cui manovrava per l'attracco, se la giornata era stata buona: un uomo di mare non ha bisogno di parole per raccontare la pesca, basta guardargli le mani.",
    "Poi iniziava il rito della pulizia: le reti stese, il pescato smistato, e sempre, sempre, qualcosa da parte per qualcuno che quel giorno ne aveva più bisogno di lui."
  ]});

// PAGE 19 — La prima seppia
pages.push({type:'content', num:19, title:"La prima seppia", dropcap:'C',
  paras:[
    "'era un rito, tra me e Don Ninuzzu, che si ripeteva ogni anno con la puntualità della primavera.",
    "Nel mese di marzo, quando il mare di Gliaca si risvegliava piano dopo l'inverno, ricevevo la sua telefonata.",
    "La sua voce, roca di salsedine e di vento, mi diceva sempre le stesse parole: Aurelio, piscai a prima siccia che è per tia."
  ]});

// PAGE 20
pages.push({type:'content', num:20, title:null, dropcap:'P',
  paras:[
    "oi aggiungeva, quasi come una domanda rituale a cui conosceva già la risposta: scenni tu a me casa, oppure te la lascio da to cugnata Giovanna?",
    "Non era, in fondo, soltanto una seppia: era il suo modo per dirmi ti ho pensato per primo, prima ancora di pensare a vendere quel pescato.",

  ]});

// PAGE 21
pages.push({type:'content', num:21, title:null, dropcap:'L',
  paras:[
    "a bontà di quest'uomo stava tutta in quel gesto piccolo e ripetuto: pensava prima agli altri, e solo dopo a se stesso.",
    "Teneva da parte per me quella prima seppia, ancora viva, che palpitava piano nella mastiddetta di plastica, come si custodisce un regalo prezioso da non rovinare.",
    "E io scendevo, quasi sempre di corsa, e trovavo la porta di casa sua aperta, il sorriso umile sul volto, le mani ruvide che mi porgevano quel dono come se mi stesse consegnando un pezzo del suo mare."
  ]});

// PAGE 22

    el.classList.add('dedica');
    let html = '';
    if(p.kicker) html += `<h3>${p.kicker}</h3>`;
    p.paras.forEach(par => html += `<p>${par}</p>`);
    if(p.signoff) html += `<div class="signoff">${p.signoff}</div>`;
    el.innerHTML = html;
  } else if(p.type === 'indice'){
    el.classList.add('indice');
    let rowsHtml = p.rows.map(r => `<div class="indice-row"><span class="t">${r[0]}</span><span class="n">${r[1]}</span></div>`).join('');
    el.innerHTML = `<h3>${p.title}</h3><div class="indice-list">${rowsHtml}</div>`;
  } else if(p.type === 'content'){
    let headerHtml = `<div class="page-header"><span>Don Ninuzzu</span><span>${p.num}</span></div>`;
    let titleHtml = p.title ? `<div class="section-title">${p.title}</div>` : '';
    let bodyHtml = '<div class="body-text">';
    p.paras.forEach((par, i) => {
      if(i === 0 && p.dropcap){

      } else {
        bodyHtml += `<p>${par}</p>`;

  }
  return el;
}

function showPage(idx){
  container.innerHTML = '';
  container.appendChild(renderPage(pages[idx]));
  pageLabel.textContent = `${idx+1} / ${TOTAL}`;
  progressFill.style.width = `${((idx+1)/TOTAL)*100}%`;
  document.getElementById('prevBtn').classList.toggle('hidden', idx===0);
  document.getElementById('nextBtn').classList.toggle('hidden', idx===TOTAL-1);
}

function goNext(){ if(current < TOTAL-1){ current++; showPage(current);} }
function goPrev(){ if(current > 0){ current--; showPage(current);} }

document.getElementById('nextBtn').addEventListener('click', goNext);
document.getElementById('prevBtn').addEventListener('click', goPrev);

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') goNext();
  if(e.key === 'ArrowLeft') goPrev();
});

// swipe
let touchStartX = null, touchStartY = null;
const book = document.getElementById('book');
book.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});
book.addEventListener('touchend', (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
    if(dx < 0) goNext(); else goPrev();
  }
  touchStartX = null; touchStartY = null;
}, {passive:true});

document.getElementById('btnSave').addEventListener('click', () => {
  alert('Per salvare: usa il menu Condividi del browser e scegli "Aggiungi a Home" oppure "Salva su File".');
});
document.getElementById('btnShare').addEventListener('click', async () => {
  if(navigator.share){
    try{ await navigator.share({title:"Don Ninuzzu 'u Barchittu", text:"Un romanzo di Aurelio Scaffidi Domianello"}); }catch(e){}
  } else {
    alert('Usa il menu di condivisione del tuo browser per inviare questo file.');
  }
});

showPage(0);
